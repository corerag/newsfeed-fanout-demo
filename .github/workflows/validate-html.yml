name: Validate HTML

on:
  push:
  pull_request:

jobs:
  validate-html:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download Nu Html Checker
        run: curl -sSL -o vnu.jar https://github.com/validator/validator/releases/latest/download/vnu.jar

      - name: Validate index.html (markup + inline CSS)
        run: java -jar vnu.jar --also-check-css index.html
